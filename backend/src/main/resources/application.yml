spring:
  autoconfigure:
    exclude: org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  port: ${PORT:8080}
app:
  ai:
    provider: ${APP_AI_PROVIDER:mock}
    # Set SUPABASE_AI_FUNCTION=analyze-expense-hj to roll back without a code change.
    function-name: ${SUPABASE_AI_FUNCTION:analyze-expense-hj-v2}
    checklist-function-name: ${SUPABASE_CHECKLIST_FUNCTION:generate-document-checklist}
  openai:
    model: ${OPENAI_MODEL:gpt-4.1-mini}
  repository:
    provider: ${APP_REPOSITORY_PROVIDER:memory}
  storage:
    provider: ${APP_STORAGE_PROVIDER:supabase}
  storage-root: ${java.io.tmpdir}/modit-backend-uploads
  supabase:
    url: ${SUPABASE_URL:}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:expense-documents}
