spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
app:
  mock-auth-enabled: true
  cors-origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://localhost:5174
    - http://127.0.0.1:5174
  supabase:
    url: ${SUPABASE_URL:${VITE_SUPABASE_URL:}}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY:${VITE_SUPABASE_PUBLISHABLE_KEY:}}
